services:
  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    container_name: compliance-api
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=compliance
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://ollama:11434
      - AGENT_WORKER_URL=http://agent-worker:8002
      - API_REQUEST_TIMEOUT=180
      - AGENT_RUN_TIMEOUT=300
    volumes:
      - ./apps/api/app:/app/app
    depends_on:
      - postgres
      - qdrant
      - ollama
      - reranker
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5

  mcp-server:
    build:
      context: apps/mcp-server
      dockerfile: Dockerfile
    container_name: compliance-mcp
    ports:
      - "8001:8001"
    env_file:
      - apps/mcp-server/.env
    environment:
      - API_BASE_URL=http://api:8000
      - API_REQUEST_TIMEOUT=180
    volumes:
      - ./apps/mcp-server:/app
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:16
    container_name: compliance-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: compliance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d compliance"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant
    container_name: compliance-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama
    container_name: compliance-ollama
    platform: linux/amd64
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  reranker:
    image: michaelf34/infinity:latest-cpu
    container_name: compliance-reranker
    ports:
      - "7997:7997"
    command: >
      v2
      --model-id cross-encoder/ms-marco-MiniLM-L-6-v2
      --port 7997
      --engine torch
    environment:
      - DO_NOT_TRACK=1
    volumes:
      - infinity_cache:/app/.cache
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7997/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  agent-worker:
    build:
      context: apps/agent-worker
      dockerfile: Dockerfile
    container_name: agent-worker
    ports:
      - "8002:8002"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=compliance
      - OLLAMA_BASE_URL=http://ollama:11434
      - MCP_BASE_URL=http://mcp-server:8001
      - MCP_TIMEOUT=180
      - PLANNER_TIMEOUT=180
    volumes:
      - ./apps/agent-worker:/app
    depends_on:
      - mcp-server
      - postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  pgdata:
  qdrant_data:
  ollama_data:
  infinity_cache:
