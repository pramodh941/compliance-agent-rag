services:
  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    container_name: compliance-api
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/app:/app/app
    depends_on:
      - postgres
      - qdrant

  mcp-server:
    build:
      context: apps/mcp-server
      dockerfile: Dockerfile
    container_name: compliance-mcp
    ports:
      - "8001:8001"
    env_file:
      - apps/mcp-server/.env
    volumes:
      - ./apps/mcp-server:/app
    depends_on:
      - api

  postgres:
    image: postgres:16
    container_name: compliance-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: compliance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    container_name: compliance-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama
    container_name: compliance-ollama
    platform: linux/amd64
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  reranker:
    image: michaelf34/infinity:latest-cpu
    container_name: compliance-reranker
    ports:
      - "7997:7997"
    command: >
      v2
      --model-id cross-encoder/ms-marco-MiniLM-L-6-v2
      --port 7997
      --engine torch
    environment:
      - DO_NOT_TRACK=1
    volumes:
      - infinity_cache:/app/.cache
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7997/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  agent-worker:
    build:
      context: apps/agent-worker
      dockerfile: Dockerfile
    container_name: agent-worker
    ports:
      - "8002:8002"
    volumes:
      - ./apps/agent-worker:/app
    depends_on:
      - mcp-server

volumes:
  pgdata:
  qdrant_data:
  ollama_data:
  infinity_cache: